# настроено так же, как Alacritty; картинки (sixel) работают, в т.ч. в yazi

[main]
pad=14x12 center
shell=/usr/bin/zsh
term=foot
# цвета и шрифт: выбираются в Настройках Quickshell
include=~/.config/foot/colors.ini

[cursor]
style=beam
blink=no
unfocused-style=hollow

[mouse]
hide-when-typing=yes

[csd]
preferred=none

[text-bindings]
# Shift+Enter, как в Alacritty
\x1b\x0d=Shift+Return

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
