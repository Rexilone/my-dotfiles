# RexOS: порталы в сеансе niri. Как системный niri-portals.conf, но окно выбора файлов — GTK
# (в новых версиях портала GNOME его рисует Nautilus, а Nautilus в RexOS не нужен — есть свой проводник).
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.FileChooser=gtk;
